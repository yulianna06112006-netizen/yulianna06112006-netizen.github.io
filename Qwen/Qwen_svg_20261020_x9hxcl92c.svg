<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900">
  <defs>
    <style>
      .bg { fill: #F7F1E8; }
      .frame { fill: #FFFDF8; stroke: #D8CBB8; stroke-width: 2; }
      .hdr { fill: #2B211A; }
      .sec { fill: #F2E7D7; stroke: #E0D2BE; stroke-width: 1; }
      .img { fill: #D9C3A5; }
      .acc { fill: #B45F3C; }
      .olv { fill: #5E6B4F; }
      .card { fill: #FFFDF8; stroke: #E6DCCD; stroke-width: 1; }
      .modal { fill: #FFFDF8; stroke: #B45F3C; stroke-width: 2; stroke-dasharray: 5 4; }
      .t { font: 12px Arial, sans-serif; fill: #2B211A; }
      .tt { font: bold 16px Arial, sans-serif; fill: #2B211A; }
      .s { font: 10px Arial, sans-serif; fill: #6F6258; }
      .l { fill: #F7F1E8; }
    </style>
  </defs>

  <rect class="bg" width="1600" height="900"/>
  <text class="tt" x="40" y="42">Макет сайта «Магазин винтажной одежды» — схема трёх страниц</text>

  <!-- Home -->
  <g transform="translate(40,70)">
    <rect class="frame" width="480" height="820" rx="12"/>
    <text class="tt" x="18" y="30">1. Главная</text>

    <rect class="hdr" x="18" y="46" width="444" height="40" rx="8"/>
    <text class="s l" x="30" y="70">Header: логотип · меню · корзина</text>

    <rect class="img" x="18" y="100" width="444" height="170" rx="10"/>
    <text class="t" x="34" y="128">Hero: атмосферное фото</text>
    <text class="s" x="34" y="146">Заголовок · подзаголовок · кнопка</text>
    <rect class="acc" x="34" y="160" width="140" height="30" rx="15"/>
    <text class="s l" x="50" y="180">Смотреть каталог</text>

    <rect class="sec" x="18" y="284" width="444" height="100" rx="10"/>
    <text class="t" x="34" y="310">Категории</text>
    <rect class="card" x="34" y="322" width="76" height="48" rx="6"/>
    <rect class="card" x="120" y="322" width="76" height="48" rx="6"/>
    <rect class="card" x="206" y="322" width="76" height="48" rx="6"/>
    <rect class="card" x="292" y="322" width="76" height="48" rx="6"/>
    <rect class="card" x="378" y="322" width="70" height="48" rx="6"/>

    <rect class="sec" x="18" y="398" width="444" height="145" rx="10"/>
    <text class="t" x="34" y="424">Новые поступления</text>
    <rect class="card" x="34" y="438" width="94" height="88" rx="6"/>
    <rect class="card" x="140" y="438" width="94" height="88" rx="6"/>
    <rect class="card" x="246" y="438" width="94" height="88" rx="6"/>
    <rect class="card" x="352" y="438" width="94" height="88" rx="6"/>

    <rect class="olv" x="18" y="557" width="444" height="80" rx="10" opacity="0.18"/>
    <text class="t" x="34" y="583">Почему винтаж: 4 преимущества</text>
    <text class="s" x="34" y="603">Уникальность · ткани · экология · проверка</text>

    <rect class="sec" x="18" y="651" width="444" height="75" rx="10"/>
    <text class="t" x="34" y="677">Отзывы: 3 цитаты с фото</text>
    <circle cx="54" cy="700" r="12" fill="#D9C3A5"/>
    <circle cx="220" cy="700" r="12" fill="#D9C3A5"/>
    <circle cx="386" cy="700" r="12" fill="#D9C3A5"/>

    <rect class="acc" x="18" y="736" width="444" height="30" rx="8" opacity="0.9"/>
    <text class="s l" x="34" y="756">Подписка: email + обещание новых поступлений</text>

    <rect class="hdr" x="18" y="776" width="444" height="30" rx="8"/>
    <text class="s l" x="34" y="796">Footer: навигация · контакты · соцсети · режим работы</text>
  </g>

  <!-- Catalog -->
  <g transform="translate(560,70)">
    <rect class="frame" width="480" height="820" rx="12"/>
    <text class="tt" x="18" y="30">2. Каталог</text>

    <rect class="hdr" x="18" y="46" width="444" height="40" rx="8"/>
    <text class="s l" x="30" y="70">Header: активный пункт «Каталог»</text>

    <rect class="sec" x="18" y="100" width="444" height="70" rx="10"/>
    <text class="t" x="34" y="126">Заголовок и вступление</text>
    <text class="s" x="34" y="146">Каждая вещь уникальна и в одном экземпляре</text>

    <rect class="card" x="18" y="184" width="120" height="360" rx="10"/>
    <text class="t" x="30" y="210">Фильтры</text>
    <text class="s" x="30" y="230">категория</text>
    <text class="s" x="30" y="248">размер</text>
    <text class="s" x="30" y="266">эпоха</text>
    <text class="s" x="30" y="284">цвет</text>
    <text class="s" x="30" y="302">цена</text>
    <text class="s" x="30" y="320">состояние</text>

    <rect class="sec" x="150" y="184" width="312" height="34" rx="8"/>
    <text class="s" x="162" y="206">Сортировка: новизна · цена · популярность</text>

    <rect class="card" x="150" y="232" width="96" height="120" rx="6"/>
    <rect class="card" x="258" y="232" width="96" height="120" rx="6"/>
    <rect class="card" x="366" y="232" width="96" height="120" rx="6"/>
    <rect class="card" x="150" y="364" width="96" height="120" rx="6"/>
    <rect class="card" x="258" y="364" width="96" height="120" rx="6"/>
    <rect class="card" x="366" y="364" width="96" height="120" rx="6"/>
    <text class="s" x="162" y="342">фото · название · эпоха · размер · цена</text>
    <rect class="acc" x="366" y="452" width="78" height="20" rx="10"/>
    <text class="s l" x="374" y="466">Продано</text>

    <rect class="modal" x="115" y="255" width="250" height="180" rx="10"/>
    <text class="t" x="132" y="282">Быстрый просмотр</text>
    <rect class="img" x="132" y="295" width="90" height="105" rx="6"/>
    <text class="s" x="234" y="310">галерея · описание</text>
    <text class="s" x="234" y="328">замеры · состав</text>
    <text class="s" x="234" y="346">состояние · дефекты</text>
    <rect class="acc" x="234" y="365" width="80" height="24" rx="12"/>
    <text class="s l" x="250" y="382">Купить</text>

    <rect class="sec" x="18" y="560" width="444" height="105" rx="10"/>
    <text class="t" x="34" y="586">Таблица размеров и замеров</text>
    <text class="s" x="34" y="606">Пояснение про винтажные размеры + инструкция снятия мерок</text>
    <rect class="card" x="34" y="620" width="412" height="28" rx="4"/>

    <rect class="sec" x="18" y="681" width="444" height="70" rx="10"/>
    <text class="t" x="34" y="707">Условия покупки</text>
    <text class="s" x="34" y="727">доставка · оплата · возврат · упаковка</text>

    <rect class="hdr" x="18" y="762" width="444" height="34" rx="8"/>
    <text class="s l" x="34" y="784">Footer: как на главной</text>
  </g>

  <!-- About -->
  <g transform="translate(1080,70)">
    <rect class="frame" width="480" height="820" rx="12"/>
    <text class="tt" x="18" y="30">3. О нас и контакты</text>

    <rect class="hdr" x="18" y="46" width="444" height="40" rx="8"/>
    <text class="s l" x="30" y="70">Header: активный пункт «О нас и контакты»</text>

    <rect class="img" x="18" y="100" width="200" height="150" rx="10"/>
    <rect class="sec" x="230" y="100" width="232" height="150" rx="10"/>
    <text class="t" x="246" y="126">История магазина</text>
    <text class="s" x="246" y="146">Идея · основатель/команда · фото</text>
    <text class="s" x="246" y="164">Эмоциональная связь с покупателем</text>

    <rect class="sec" x="18" y="266" width="444" height="110" rx="10"/>
    <text class="t" x="34" y="292">Как мы подбираем вещи</text>
    <rect class="card" x="34" y="306" width="126" height="54" rx="6"/>
    <rect class="card" x="174" y="306" width="126" height="54" rx="6"/>
    <rect class="card" x="314" y="306" width="126" height="54" rx="6"/>
    <text class="s" x="42" y="338">рынки</text>
    <text class="s" x="182" y="338">отбор/чистка</text>
    <text class="s" x="322" y="338">реставрация</text>

    <rect class="olv" x="18" y="392" width="444" height="70" rx="10" opacity="0.18"/>
    <text class="t" x="34" y="418">Наши ценности</text>
    <text class="s" x="34" y="438">осознанность · вторая жизнь · честное состояние</text>

    <rect class="sec" x="18" y="478" width="444" height="115" rx="10"/>
    <text class="t" x="34" y="504">FAQ: аккордеон</text>
    <rect class="card" x="34" y="518" width="412" height="20" rx="4"/>
    <rect class="card" x="34" y="544" width="412" height="20" rx="4"/>
    <rect class="card" x="34" y="570" width="412" height="20" rx="4"/>

    <rect class="sec" x="18" y="609" width="220" height="100" rx="10"/>
    <text class="t" x="34" y="635">Контакты и адрес</text>
    <text class="s" x="34" y="655">шоурум · режим · телефон</text>
    <text class="s" x="34" y="673">email · мессенджеры · соцсети</text>
    <rect class="img" x="250" y="609" width="212" height="100" rx="10"/>
    <text class="t" x="266" y="635">Карта проезда</text>

    <rect class="sec" x="18" y="725" width="444" height="50" rx="10"/>
    <text class="t" x="34" y="747">Форма обратной связи</text>
    <text class="s" x="34" y="765">имя · email · тема · сообщение · отправить</text>

    <rect class="hdr" x="18" y="782" width="444" height="30" rx="8"/>
    <text class="s l" x="34" y="802">Footer: единый для всех страниц</text>
  </g>
</svg>